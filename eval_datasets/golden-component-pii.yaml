    expected_spans:
    - alice@example.com
  tags:
  - pii
  - email
  metadata: {}
- id: pii-phone-1
  component: pii
  input:
    text: Call 555-123-4567
  expected:
    expected_spans:
    - 555-123-4567
  tags:
  - pii
  - phone
  metadata: {}
- id: pii-mixed-1
  component: pii
  input:
    text: SSN 123-45-6789 and IP 192.168.1.1
  expected:
    expected_spans:
    - 123-45-6789
    - 192.168.1.1
  tags:
  - pii
  - mixed
  metadata: {}
pipeline_tests: []
