name: example-pii-eval
description: "Example pii component evaluation dataset \u2013 isolated tests for pii."
version: 1.0.0
kind: component
component: pii
pipeline: null
metrics:
- pii_redaction_recall
- pii_redaction_precision
- pii_redaction_f1
k_values:
- 5
tests: []
component_tests:
- id: pii-email-1
  component: pii
  input:
    text: Contact me at alice@example.com for details
