component_tests:
- id: parser-txt-1
  component: parser
  input:
    path: doc.txt
    content_bytes: Hello world plain text
  expected:
    expected_text: Hello world plain text
  tags:
  - parser
  - txt
  metadata: {}
- id: parser-md-1
  component: parser
  input:
    path: doc.md
    content_bytes: '# Title

      Content'
  expected:
    expected_text: '# Title

      Content'
  tags:
  - parser
  - markdown
  metadata: {}
- id: parser-html-1
  component: parser
  input:
    path: doc.html
    content_bytes: <html><body><p>Hello</p><script>alert(1)</script></body></html>
  expected:
    expected_text: Hello
  tags:
  - parser
  - html
  metadata: {}
- id: chunker-md-1
  component: chunker
  input:
    text: '# Section A

      Content A


      ## Section B

      Content B'
    path: doc.md
  expected:
    expected_titles:
    - Section A
    - Section B
  tags:
  - chunker
  - markdown
  - section
  metadata: {}
- id: chunker-code-1
  component: chunker
  input:
    text: "def hello():\n    pass\n\ndef world():\n    pass"
    path: code.py
  expected:
    expected_function_titles:
    - def hello
    - def world
  tags:
  - chunker
  - code
  metadata: {}
- id: chunker-dedup-1
  component: chunker
  input:
    text: 'Hello world


      Hello world


      Unique content'
    path: doc.txt
    config:
      chunking.dedup_enabled: true
  expected:
    expected_deduped_count: 2
    original_count: 3
  tags:
  - chunker
  - dedup
  metadata: {}
- id: cleaner-unicode-1
  component: cleaner
  input:
    raw: "hello\_world"
  expected:
    expected_cleaned: hello world
  tags:
  - cleaner
  - unicode
  metadata: {}
- id: cleaner-hyphen-1
